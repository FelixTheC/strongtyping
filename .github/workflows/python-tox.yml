name: Python tox

on:
  push:
    branches:
      - 'py_3_14'
      - 'py_3_13'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: |
            '3.13'
            '3.14'
            '3.15'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run tox
        run: uv run tox
