# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [ created ]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.extract.outputs.version }}
      python-short: ${{ steps.extract.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Extract Python version info
        id: extract
        run: |
          PYTHON_CODE=$(cat <<EOF
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
              req = data['project']['requires-python'].replace('>=', '').strip()
              print(f"version={req}")
              print(f"short={req.replace('.', '')}")
          EOF
          )
          python3 -c "$PYTHON_CODE" >> "$GITHUB_OUTPUT"

  update_version:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new-sha: ${{ steps.get-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set Release version
        run: uv version ${{ github.event.release.tag_name }}

      - name: Commit and push changes
        id: get-sha
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ github.event.release.tag_name }}"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build_sdist:
    needs: [ setup, update_version ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update_version.outputs.new-sha }}

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.setup.outputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist
        run: uv build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheels:
    needs: [ setup, update_version ]
    name: Build wheels on ${{ matrix.os }} for Python ${{ needs.setup.outputs.python-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update_version.outputs.new-sha }}

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.setup.outputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheels via cibuildwheel
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD_FRONTEND: "uv"
          CIBW_BUILD: "cp${{ needs.setup.outputs.python-short }}-*"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ needs.setup.outputs.python-version }}
          path: ./wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: [ build_wheels, build_sdist ]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download sdist and wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1