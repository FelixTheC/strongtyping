[project]
name = "strongtyping"
version = "3.14.5"
authors = [
    { name = "FelixTheC" },
]
description = "Decorator which checks whether the function is called with the correct type of parameters"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "ujson>=5.12.0",
    "librt>=0.10.0",
    "typing-extensions>=4.4.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
license = { text = "CC-BY-ND-4.0" }

[project.urls]
Homepage = "https://github.com/FelixTheC/strongtyping"
Repository = "https://github.com/FelixTheC/strongtyping"
Documentation = "https://strongtyping.readthedocs.io/en/latest/"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=strongtyping --cov-report=term-missing"

# --- BUILD SYSTEM ---
# Since you are using mypyc, setuptools is currently the most stable backend
# for handling C-extensions via a setup.py or build script.
[build-system]
requires = ["setuptools>=61.0", "wheel", "mypy>=1.20.1", "mypy[mypyc]>=1.20.1", "librt>=0.10.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["strongtyping", "strongtyping-stubs"]
include-package-data = true

[tool.setuptools.package-data]
"strongtyping-stubs" = ["**/*.py", "**/*.pyi"]
"strongtyping" = ["py.typed", "skills/**/*"]

# --- UV DEPENDENCY GROUPS ---
# Move your testing and dev tools here so they don't bloat your production install
[dependency-groups]
dev = [
    "mypy[mypyc]>=1.20.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.3.0",
    "cibuildwheel>=3.4.1",
    "pyyaml>=6.0.3",
    "tox>=4.53.1",
    "pytest-asyncio>=1.4.0",
]

# --- TOOL CONFIGS ---
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]
exclude = ["src/strongtyping/tests"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
exclude = ['^tests/']

[tool.cibuildwheel]
build = "cp313-* cp314-* cp315-*"
skip = "pp* *musllinux*"
test-skip = "*"
#before-build = "python -m pip install --upgrade pip setuptools wheel mypy librt"

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
